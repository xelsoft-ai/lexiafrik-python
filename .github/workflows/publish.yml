# Publication sur PyPI SANS jeton secret : « Trusted Publishing » (identité OIDC de GitHub).
# Prérequis (une fois, sur pypi.org et test.pypi.org) : déclarer ce dépôt et ce fichier comme éditeur de confiance
# du projet « lexiafrik » (propriétaire xelsoft-ai, dépôt lexiafrik-python, workflow publish.yml,
# environnement pypi / testpypi). Voir le README du dépôt.
#
#   Essai :       onglet Actions > Publication > Run workflow > cible « testpypi »
#   Production :  créer une « Release » GitHub (ou Run workflow > cible « pypi »)
name: Publication

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Où publier"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests et construction
        run: |
          python -m pip install --upgrade pip build twine pytest httpx websockets
          python -m pytest -q tests
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
